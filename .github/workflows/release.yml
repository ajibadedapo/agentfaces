name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    if: ${{ github.repository == 'ajibadedapo/agentfaces' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
      pull-request: ${{ steps.changesets.outputs.pullRequestNumber }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Open or update the release pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version-packages
          title: "Release: version packages"
          commit: "Release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: version
    if: ${{ needs.version.outputs.has-changesets == 'true' && needs.version.outputs.pull-request != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.pull-request.outputs.sha }}
    steps:
      - name: Resolve the release pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.version.outputs.pull-request }}
        run: |
          details="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName,headRefOid,state,isCrossRepository,baseRefName --jq '[.headRefName, .headRefOid, .state, (.isCrossRepository | tostring), .baseRefName] | join(" ")')"
          read -r head_ref head_sha state cross_repo base_ref <<< "$details"
          if [ "$head_ref" != "changeset-release/main" ] || [ "$state" != "OPEN" ] || [ "$cross_repo" != "false" ] || [ "$base_ref" != "main" ]; then
            echo "Pull request #$PR_NUMBER is not the open release pull request: $details"
            exit 1
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pull-request.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm run docs:build
      - run: npm pack --dry-run

  merge:
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Report the verified head as passing check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.verify.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context=check \
            -f description="Verified by the release workflow" \
            -f target_url="$RUN_URL" > /dev/null
      - name: Merge the release pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.version.outputs.pull-request }}
          HEAD_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
          for attempt in 1 2 3 4 5 6; do
            result="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,mergeCommit --jq '[.state, (.mergeCommit.oid // "")] | join(" ")')"
            read -r state merge_sha <<< "$result"
            if [ "$state" = "MERGED" ] && [ -n "$merge_sha" ]; then
              echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "Pull request #$PR_NUMBER did not merge: $result"
          exit 1

  publish:
    needs: [version, merge]
    if: ${{ always() && needs.version.result == 'success' && (needs.version.outputs.has-changesets == 'false' || needs.merge.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.merge.outputs.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check whether this version is already on npm
        id: npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm yet"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.npm.outputs.publish == 'true' }}
        run: npm install -g npm@latest
      - if: ${{ steps.npm.outputs.publish == 'true' }}
        run: npm ci
      - if: ${{ steps.npm.outputs.publish == 'true' }}
        run: npm run lint && npm run typecheck && npm test && npm run build && npm run size
      - name: Publish to npm, push the tag and create the GitHub release
        if: ${{ steps.npm.outputs.publish == 'true' }}
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
